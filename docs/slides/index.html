<!doctype html>
<html lang="en">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>PayProof — Pitch</title>
  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #10231e;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #stage {
      position: relative;
      width: min(100vw, 177.7778vh);
      height: min(56.25vw, 100vh);
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    .sr {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip-path: inset(50%);
    }
    #video-panel {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      background: #10231e;
    }
    #player {
      position: relative;
      width: min(1200px, calc(100vw - 96px), calc((100vh - 176px) * 16 / 9));
      aspect-ratio: 16 / 9;
    }
    #video-panel[hidden] {
      display: none;
    }
    video {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    #next {
      position: fixed;
      right: 32px;
      bottom: 24px;
      padding: 12px 24px;
      border: 1px solid #b9d3c6;
      background: #10231e;
      color: #fff;
      font:
        24px Arial,
        sans-serif;
      cursor: pointer;
    }
    #next:focus-visible {
      outline: 3px solid #fff;
      outline-offset: 4px;
    }
  </style>
  <div id="stage">
    <canvas id="screen" width="1920" height="1080" aria-label="PayProof presentation"></canvas>
    <h1 class="sr" id="title">PayProof</h1>
    <div id="video-panel">
      <div id="player">
        <video id="video" controls playsinline preload="metadata" tabindex="0"></video>
      </div>
      <button id="next" type="button">Next</button>
    </div>
  </div>
  <script type="module" src="deck.js?v=20261114-voice-next"></script>
</html>
