<!doctype html>
<html lang="en">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>PayProof — Pitch</title>
  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #10231e;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #stage {
      position: relative;
      width: min(100vw, 177.7778vh);
      height: min(56.25vw, 100vh);
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    .sr {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip-path: inset(50%);
    }
    #video-panel {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      background: #10231e;
    }
    #player {
      position: relative;
      width: min(1200px, calc(100vw - 96px), calc((100vh - 96px) * 16 / 9));
      aspect-ratio: 16 / 9;
    }
    #video-panel[hidden],
    #play[hidden] {
      display: none;
    }
    video {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    #play {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      padding: 20px 30px;
      border: 2px solid #b9d3c6;
      background: #10231ef0;
      color: #fff;
      font:
        clamp(22px, 3vw, 48px) Arial,
        sans-serif;
      cursor: pointer;
    }
    #play:focus-visible {
      outline: 4px solid white;
      outline-offset: 6px;
    }
  </style>
  <div id="stage">
    <canvas id="screen" width="1920" height="1080" aria-label="PayProof presentation"></canvas>
    <h1 class="sr" id="title">PayProof</h1>
    <div id="video-panel">
      <div id="player">
        <video id="video" controls playsinline preload="metadata" tabindex="0"></video
        ><button id="play" type="button">Play overview · sound on</button>
      </div>
    </div>
  </div>
  <script type="module" src="deck.js?v=20261114-v10-player-keys"></script>
</html>
